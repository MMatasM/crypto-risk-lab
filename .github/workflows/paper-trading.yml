# The nightly run, shortly after the daily close (00:00 UTC). In order:
#   1. Market scan: fetch the newest daily closes for the top coins and the watchlist, score and rank them.
#   2. Forecast: retrain the models, test them again on past data, log tonight's forecasts, score the old ones.
#   3. Paper trading (fake money, real prices): trade the finished days not yet traded.
#   4. Telegram summary: one message, only when something happened, only if the bot is set up (see README.md).
# Then save the results back to the repository and republish the site.
# Safe to run by hand any time (Actions -> Nightly run -> Run workflow): a day is never scanned or traded
# twice, and missed days are caught up in order. A step that fails doesn't stop the ones after it; the run
# is still marked failed at the end, so GitHub emails you.
#
# Strongly recommended: a free CoinGecko Demo key as the repository secret COINGECKO_DEMO_KEY
# (see README.md). Without it the scan takes over an hour instead of about 6 minutes.
name: Nightly run

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC every day (GitHub may start it a little late)
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send a Telegram test message
        type: boolean
        default: false

permissions:
  contents: write # commit the updated results
  actions: write # start the "Deploy to GitHub Pages" workflow afterwards

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (never trade with broken code)
        run: npm test
      - name: Market scan
        id: scan
        continue-on-error: true
        run: npm run scan
      - name: Forecast
        id: forecast
        continue-on-error: true
        run: npm run forecast
      - name: Paper trading
        id: paper
        continue-on-error: true
        run: npm run paper
      - name: Telegram summary
        id: notify
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TEST: ${{ inputs.telegram_test }}
        run: npm run notify
      - name: Save the results
        id: save
        run: |
          git add public/paper public/data data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly run of $(date -u +%F)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made by a workflow doesn't start other workflows, so start the deploy explicitly.
      - name: Republish the site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Mark the run failed if a step failed
        if: steps.scan.outcome == 'failure' || steps.forecast.outcome == 'failure' || steps.paper.outcome == 'failure' || steps.notify.outcome == 'failure'
        run: |
          echo "Scan: ${{ steps.scan.outcome }}, forecast: ${{ steps.forecast.outcome }}, paper trading: ${{ steps.paper.outcome }}, Telegram: ${{ steps.notify.outcome }}. See the step logs above."
          exit 1
