# Paper trading (fake money, real prices): every night shortly after the daily close (00:00 UTC), fetch the
# closes from CoinGecko, trade the finished days not yet traded, save public/paper/*.json back to the
# repository and republish the site. Safe to run by hand any time (Actions -> Paper trading -> Run workflow):
# a day is never traded twice, and missed days are caught up in order.
#
# Optional: a free CoinGecko Demo key as the repository secret COINGECKO_DEMO_KEY (see README.md).
name: Paper trading

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC every day (GitHub may start it a little late)
  workflow_dispatch:

permissions:
  contents: write # commit the updated results
  actions: write # start the "Deploy to GitHub Pages" workflow afterwards

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (never trade with broken code)
        run: npm test
      - name: Trade
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
        run: npm run paper
      - name: Save the results
        id: save
        run: |
          git add public/paper
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Paper trading: run of $(date -u +%F)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made by a workflow doesn't start other workflows, so start the deploy explicitly.
      - name: Republish the site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
